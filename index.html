<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>South Hill on Madison</title>
	<style type="text/css">
		html, body {
			height: 100%;
			margin: 0;
			padding: 0;
			background-color: #000000;
			overflow: hidden;
		}
		#container {
			width: 100%;
			height: 100%;
			min-width: 1000px;
			min-height: 700px;
		}
		object, embed {
			width: 100%;
			height: 100%;
		}
	</style>
</head>
<body>
	<div id="container">
		<embed src="index.swf" 
		       type="application/x-shockwave-flash"
		       width="100%" 
		       height="100%"
		       quality="high"
		       scale="noscale"
		       wmode="window"
		       allowscriptaccess="always"
		       bgcolor="#000000">
	</div>
</body>
</html>
